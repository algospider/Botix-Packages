name: Build Ubuntu Rootfs (ARM64)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g., ubuntu-24.04-dev-20250115)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build rootfs for ARM64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build rootfs image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.rootfs
          platforms: linux/arm64
          load: true
          tags: botix-rootfs:arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Export rootfs tarball
        run: |
          CID=$(docker create --platform linux/arm64 botix-rootfs:arm64)
          docker export $CID | gzip > ubuntu-base-24.04.3-dev-arm64.tar.gz
          docker rm $CID
          echo "Created ubuntu-base-24.04.3-dev-arm64.tar.gz ($(du -h ubuntu-base-24.04.3-dev-arm64.tar.gz | cut -f1))"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rootfs-arm64
          path: ubuntu-base-24.04.3-dev-arm64.tar.gz

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: List artifacts
        run: ls -lh ./artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag }}
          name: Ubuntu 24.04 Dev Rootfs (ARM64)
          body: |
            Pre-built Ubuntu 24.04 rootfs with development tools for Botix terminal (ARM64).
            
            **Included packages:**
            - Build tools: build-essential, cmake, pkg-config, libssl-dev
            - Version control: git, git-lfs
            - Languages: python3, python3-pip, nodejs, npm
            - Utilities: curl, wget, jq, tree, htop, vim, nano, tmux, screen
            - Modern CLI tools: ripgrep, fd-find, bat, eza
          files: |
            ./artifacts/ubuntu-base-24.04.3-dev-arm64.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}